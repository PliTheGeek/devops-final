version: '3.8'



services:

  # DB - PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: coffee_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: coffee_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - monitoring

  # Project App - Coffee-Calc
  app:
    build: 
      context: ./coffee-calc      
      dockerfile: Dockerfile
    container_name: coffee_app
    restart: always
    ports:
      - "3000:3000"           
    networks:
      - monitoring     
    depends_on:
      - db
    environment:
      - DB_HOST=db            
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}  

  # 2. PROMETHEUS 
  prometheus:
    image: prom/prometheus:latest
    volumes:
      
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"           
    networks:
      - monitoring

  # 3. GRAFANA (Dashboard Visual)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"           # Portnya 3001 Biar Ga Bentrok Sama Port App
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin  
    networks:
      - monitoring
    depends_on:
      - prometheus            

networks:
  monitoring:
    driver: bridge
volumes:
  postgres_data: