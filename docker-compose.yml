version: '3.8'



services:

  # DB - PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: coffee_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: coffee_db
    volumes:
      # Mapping script init.sql supaya tabel otomatis dibuat pas pertama jalan
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      # (Opsional) Supaya data ga hilang pas container dimatiin
      - postgres_data:/var/lib/postgresql/data
    networks:
      - monitoring

  # Project App - Coffee-Calc
  app:
    build: ./coffee-calc      
    ports:
      - "3000:3000"           
    networks:
      - monitoring     
    depends_on:
      - db
    environment:
      - DB_HOST=db            
      - DB_USER=user
      - DB_PASS=password
      - DB_NAME=coffee_db    
    volumes:
      - ./coffee-calc:/app
      - /app/node_modules   

  # 2. PROMETHEUS 
  prometheus:
    image: prom/prometheus:latest
    volumes:
      
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"           
    networks:
      - monitoring

  # 3. GRAFANA (Dashboard Visual)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"           # Portnya 3001 Biar Ga Bentrok Sama Port App
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin  
    networks:
      - monitoring
    depends_on:
      - prometheus            

networks:
  monitoring:
    driver: bridge
volumes:
  postgres_data: